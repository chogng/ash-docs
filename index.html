<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Ash 文档</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="学习如何使用、配置和扩展 Ash。" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #a04e38;
        --link-color: #a04e38;
        --sidebar-width: 290px;
        --content-max-width: 920px;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app-name-link {
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .app-nav {
        margin-right: 32px;
      }

      .markdown-section {
        max-width: var(--content-max-width);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3,
      .markdown-section h4 {
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .markdown-section img,
      .markdown-section video {
        max-width: 100%;
        height: auto;
      }

      .markdown-section blockquote {
        border-left: 4px solid #42b983;
        padding: 0.5em 1em;
        background: #f8fafc;
      }

      .markdown-section blockquote.alert-note {
        border-left-color: #0969da;
        background: #ddf4ff;
      }

      .markdown-section blockquote.alert-tip {
        border-left-color: #1a7f37;
        background: #dafbe1;
      }

      .markdown-section blockquote.alert-warning {
        border-left-color: #9a6700;
        background: #fff8c5;
      }

      .markdown-section blockquote.alert-important {
        border-left-color: #8250df;
        background: #fbefff;
      }

      .markdown-section blockquote.alert-caution {
        border-left-color: #cf222e;
        background: #ffebe9;
      }

      .markdown-section blockquote .alert-title {
        display: flex;
        align-items: center;
        gap: 0.4em;
        margin-bottom: 0.25em;
        font-weight: 600;
      }

      .sidebar-nav li.folder > p,
      .sidebar-nav li.folder > strong {
        position: relative;
        display: block;
        padding-right: 20px;
        cursor: pointer;
        user-select: none;
      }

      .sidebar-nav li.folder > p::after,
      .sidebar-nav li.folder > strong::after {
        content: "\25B6";
        position: absolute;
        top: 50%;
        right: 0;
        color: #999;
        font-size: 0.6em;
        transform: translateY(-50%);
        transition: transform 0.2s;
      }

      .sidebar-nav li.folder.open > p::after,
      .sidebar-nav li.folder.open > strong::after {
        transform: translateY(-50%) rotate(90deg);
      }

      .sidebar-nav li.folder > ul {
        display: none !important;
        overflow: hidden;
      }

      .sidebar-nav li.folder.open > ul {
        display: block !important;
      }

      .flow-diagram {
        margin: 1.5rem 0;
        overflow-x: auto;
        text-align: center;
      }

      .flow-diagram svg {
        max-width: 100%;
        height: auto;
      }

      @media (max-width: 768px) {
        .app-nav {
          margin-right: 16px;
        }

        .markdown-section {
          padding: 24px 20px;
        }
      }

      body { color: #292724; background: #fffefa; }
      .sidebar { background: #f8f7f3; border-right: 1px solid #e9e6df; }
      .sidebar .app-name { text-align: left; padding: 8px 24px; font-size: 24px; }
      .sidebar-nav { padding: 12px 24px; }
      .sidebar-nav li > a { font-size: 14px; }
      .sidebar-nav li.active > a { color: #a04e38; border-right-color: #a04e38; }
      .markdown-section { max-width: 860px; padding: 64px 48px 100px; line-height: 1.85; }
      .markdown-section h1 { font-size: 40px; line-height: 1.25; margin-bottom: 24px; }
      .markdown-section h2 { margin-top: 44px; font-size: 24px; }
      .markdown-section a { text-decoration-thickness: 1px; text-underline-offset: 4px; }
      .markdown-section pre { border: 1px solid #e9e6df; border-radius: 10px; background: #f7f6f2; }
      .markdown-section blockquote { border-left: 3px solid #a04e38; background: #f6f2eb; color: #4d463e; }
      .doc-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
      .doc-card { display: block; border: 1px solid #e4e0d8; border-radius: 12px; padding: 24px; text-decoration: none !important; color: #292724 !important; }
      .doc-card:hover { background: #f8f5ef; border-color: #b7aa96; }
      .doc-card strong { display: block; margin-bottom: 8px; font-size: 18px; }
      .doc-card span { color: #6b655e; font-size: 14px; }
      @media(max-width: 768px) { .markdown-section { padding: 40px 24px; } .markdown-section h1 { font-size: 32px; } .doc-cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app">正在加载文档…</div>

    <script>
      window.$docsify = {
        name: "Ash 文档",
        repo: "https://github.com/chogng/ash-docs",
        homepage: "docs/getstarted/overview.md",
        loadSidebar: true,
        loadNavbar: true,
        relativePath: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          placeholder: "搜索文档…",
          noData: "没有找到相关文档。",
          depth: 3,
          paths: "auto",
        },
        alias: {
          "/docs.*/_sidebar.md": "/_sidebar.md",
          "/.*/_sidebar.md": "/_sidebar.md",
          "/.*/_navbar.md": "/_navbar.md",
        },
        plugins: [
          function normalizeMarkdown(hook, vm) {
            var pageDescription = "";

            hook.beforeEach(function (content) {
              pageDescription = "";

              var frontmatter = content.match(/^---\s*\n([\s\S]*?)\n---\s*\n*/);
              if (frontmatter) {
                var description = frontmatter[1].match(/^MetaDescription:\s*(.+)$/m);
                pageDescription = description ? description[1].trim() : "";
                content = content.slice(frontmatter[0].length);
              }

              content = content.replace(
                /^(>\s*)\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\]\s*$/gm,
                function (_, prefix, type) {
                  var icons = { NOTE: "ℹ️", TIP: "💡", WARNING: "⚠️", IMPORTANT: "❗", CAUTION: "🔥" };
                  var label = type.charAt(0) + type.slice(1).toLowerCase();
                  return prefix + '<span class="alert-title" data-alert-type="' + type.toLowerCase() + '">' + (icons[type] || "") + " " + label + "</span>";
                },
              );

              // Docsify resolves relative links from the current Markdown file.
              // Convert the generated root-relative article links accordingly.
              var file = vm.route.file || "";
              var dir = file.substring(0, file.lastIndexOf("/") + 1);
              // Hash routes remain rooted at this Pages project, including on the homepage.
              content = content.replace(
                /\]\(\/docs\/(.*?)\)/g,
                function (_match, target) {
                  var parts = target.split("#");
                  var route = "#/docs/" + parts[0].replace(/\.md$/, "");
                  if (parts[1]) route += "?id=" + encodeURIComponent(parts[1]);
                  return "](" + route + ")";
                },
              );

              // Resolve relative paths in raw HTML attributes as well. Docsify's
              // relativePath option only handles Markdown images automatically.
              content = content.replace(
                /((?:src|poster|placeholder)=["'])(\.\.\/)+(.*?["'])/g,
                function (match, prefix, _dots, rest) {
                  var ups = match.match(/\.\.\//g).length;
                  var base = dir;
                  for (var i = 0; i < ups; i++) {
                    base = base.substring(0, base.slice(0, -1).lastIndexOf("/") + 1);
                  }
                  return prefix + base + rest;
                },
              );
              content = content.replace(
                /((?:src|poster|placeholder)=["'])\.\/((?!http)[^"']*["'])/g,
                "$1" + dir + "$2",
              );
              content = content.replace(
                /((?:src|poster|placeholder)=["'])(images\/)/g,
                "$1" + dir + "$2",
              );

              return content;
            });

            hook.doneEach(function () {
              var title = document.querySelector(".markdown-section h1");
              if (title && title.textContent) document.title = title.textContent.trim() + " · Ash 文档";

              if (pageDescription) {
                var description = document.querySelector('meta[name="description"]');
                if (!description) {
                  description = document.createElement("meta");
                  description.name = "description";
                  document.head.appendChild(description);
                }
                description.content = pageDescription;
              }

              document.querySelectorAll(".alert-title[data-alert-type]").forEach(function (span) {
                var blockquote = span.closest("blockquote");
                if (blockquote) blockquote.classList.add("alert-" + span.dataset.alertType);
              });
            });
          },
          function collapsibleSidebar(hook) {
            function initializeSidebar() {
              var nav = document.querySelector(".sidebar-nav");
              if (!nav) return;

              nav.querySelectorAll("li").forEach(function (item) {
                if (item.classList.contains("folder")) return;
                var hasChildren = Array.from(item.children).some(function (child) {
                  return child.tagName === "UL";
                });
                if (!hasChildren) return;

                item.classList.add("folder");
                var toggle = Array.from(item.children).find(function (child) {
                  return ["P", "A", "STRONG"].includes(child.tagName);
                });
                if (toggle) {
                  toggle.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    item.classList.toggle("open");
                  });
                }
              });

              var active = nav.querySelector("li.active");
              if (active) {
                var parent = active.parentElement;
                while (parent) {
                  if (parent.tagName === "LI" && parent.classList.contains("folder")) parent.classList.add("open");
                  parent = parent.parentElement;
                }
              }

              var currentPath = (window.location.hash.replace(/^#/, "") || "/").split("?")[0];
              nav.querySelectorAll("a").forEach(function (link) {
                var href = (link.getAttribute("href") || "").replace(/^#/, "").split("?")[0];
                if (href && currentPath.indexOf(href) === 0) {
                  var folder = link.closest("li.folder");
                  while (folder) {
                    folder.classList.add("open");
                    var parentUl = folder.parentElement;
                    folder = parentUl ? parentUl.closest("li.folder") : null;
                  }
                }
              });
            }

            hook.doneEach(function () {
              window.setTimeout(initializeSidebar, 0);
            });
          },
          function renderMermaid(hook) {
            hook.doneEach(function () {
              if (!window.mermaid) return;
              var blocks = document.querySelectorAll(".markdown-section pre > code.lang-mermaid, .markdown-section pre > code.language-mermaid");
              if (!blocks.length) return;

              window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" });
              blocks.forEach(function (code, index) {
                var container = document.createElement("div");
                container.className = "flow-diagram";
                var source = code.textContent || "";
                var id = "ash-diagram-" + Date.now() + "-" + index;
                code.parentElement.replaceWith(container);

                window.mermaid.render(id, source).then(function (result) {
                  container.innerHTML = result.svg;
                  if (result.bindFunctions) result.bindFunctions(container);
                }).catch(function () {
                  container.classList.add("flow-diagram-error");
                  container.textContent = "流程图暂时无法渲染。";
                });
              });
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  </body>
</html>
